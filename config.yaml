# Central configuration for the SupeRR Selector pipeline.
# Every threshold / rule used by the code lives here (see planning/07_Execution_Roadmap.md).

paths:
  raw: "Data Pack"            # relative to project root; read-only
  interim: "data_interim"     # local-only parquet (never share / commit)
  outputs: "outputs"

reference_date: "2026-11-01"  # last match date in the pack; recency anchor

# ---- Delivery semantics (validated in planning/02 §3.6) ----
extras:
  wide: ["wide"]
  noball: ["Overstep", "other"]   # 'other' behaves as a no-ball (adds a ball to the over)
  non_delivery: ["Penalty"]       # penalty runs: not a delivery
bowler_wicket_types: ["Bowled", "Caught", "LBW", "Stump", "Hit Wicket"]
batter_dismissal_exclude: ["Retire Out"]          # tactical retirement is not a batting failure
dismissal_type_fixes:
  "Obstracting the field": "Obstructing the field"

spin_bowling_types:
  - "Right-arm Leg-Break"
  - "Right-arm offbreak"
  - "Slow left-arm orthodox"
  - "Left-arm Chinaman"

phases:            # by over number (1-based), 20-over innings
  powerplay: [1, 6]
  middle: [7, 15]
  death: [16, 20]

default_ball_limit: 120
super_over_ball_limit: 6
collapse_window_legal_balls: 18

# ---- Competition tiers (planning/04 §6; decision D3) ----
tiers:
  ipl_name_prefix: "IPL "
  a_team_comp_ids: [2670, 3289]   # Emerging Teams Asia Cup 2024, Asia Cup Rising Stars 2025
  top_full_members:               # T2 = T20I where BOTH teams are in this list
    - Afghanistan
    - Australia
    - Bangladesh
    - England
    - India
    - New Zealand
    - Pakistan
    - South Africa
    - Sri Lanka
    - West Indies

# ---- Eligibility (decision D2) ----
eligibility:
  active_since: "2025-01-01"

# ---- Pressure (planning/03; T7) ----
pressure:
  tier_quantiles: [0.50, 0.75, 0.90]     # Low < P50 ≤ Moderate < P75 ≤ High < P90 ≤ Extreme
  tier_groups: "ipl_vs_other"            # cut-points computed within IPL and within non-IPL
  li_cap_quantile: 0.99                  # leverage weight w_b = min(LI, P99)
  alive_wp: [0.05, 0.95]                 # rule-based PI only counts "live" situations
  pi_weights: [0.3333, 0.3333, 0.3334]   # equal a-priori weights (sensitivity ±50% later)
  outcome_context_wih_bins: [0, 3, 6, 8, 10]
  bootstrap_reps: 500                    # match-cluster bootstrap for tier separation CIs
  seed: 20261117

# ---- Baselines & player metrics (planning/04; T8–T9) ----
# LOCKED 17 Nov 2026 before any player-level output was produced (planning/04 §10.3).
baselines:
  # hierarchy: each level adds one dimension; sparse cells shrink to the parent level
  levels: [["innings", "phase"], ["wbin"], ["pressure_tier"], ["pace_or_spin"], ["tier"], ["year"]]
  shrink_k: 50                     # pseudo-balls toward the parent cell
metrics:
  recency_half_life_years: 2.0     # r_b = 0.5^((ref_date - match_date)/H)
  exclude_no_result: true
  min_pressure_balls_innings: 4    # batting: a "pressure innings" for consistency stats
  min_pressure_balls_spell: 6      # bowling: a "pressure spell"
  tier_credibility_fallback:       # used if bridging-player estimate is unstable (CI width > 0.5)
    T1_IPL: 1.0
    T2_T20I_TOP: 0.9
    T3_T20I_OTHER: 0.6
    T4_A_TEAM: 0.6
composite_weights:                 # planning/04 §10.1–10.2 (a priori)
  performance: 0.40                # B3 / W3 pressure value (EB-shrunk)
  wpa: 0.20                        # B4 / W4 pressure WPA
  differential: 0.20               # B9 / W10 pressure − non-pressure value
  consistency: 0.20                # success − failure rate across pressure innings / spells
eligibility_provisional:           # finalised by reliability analysis in T10
  bat_min_pressure_balls: 120
  bat_min_pressure_innings: 20
  bowl_min_pressure_balls: 150
  bowl_min_pressure_matches: 20

# ---- Reliability rules (T10) — written BEFORE reliability results were computed ----
reliability:
  random_splits: 20                 # random half-splits of matches (split-half reliability)
  min_half_bat_pressure_balls: 60   # player needs this many pressure balls in EACH half
  min_half_bowl_pressure_legal: 75
  min_season_bat_pressure_balls: 60 # season-to-season stability sample
  min_season_bowl_pressure_legal: 75
  # Weight rule (planning/04 §10.3): if full-sample (Spearman-Brown) reliability of a composite
  # component < 0.2, weight := weight × max(rel, 0) / mean(max(rel, 0) over components);
  # then renormalise all weights to sum to 1.
  weight_rule_threshold: 0.2
  # Eligibility rule (planning/03 §8): minimum pressure balls := stabilisation point n*
  # of the core value metric (reliability 0.5), PROVIDED that leaves >= 40 eligible players
  # in the list; otherwise keep the provisional thresholds and report the expected
  # reliability at that threshold (shrinkage then handles the remaining noise).
  min_pool_size: 40

# ---- T11 estimator selection (decision D5) — written BEFORE any T11 result ----
estimators:
  test_seasons: [2024, 2025, 2026]     # chronological folds: train on all earlier seasons
  min_test_pressure_balls: 40          # evaluation players: >= this many pressure balls in test season
  min_train_eff_n: 30                  # ... and >= this effective n on all training balls
  min_eb_eff_n: 30                     # players used to estimate EB hyper-parameters
  inner_min_eff_n: 20                  # inner-split calibration sample
  bootstrap_reps: 300                  # match-cluster bootstrap for rank uncertainty (final fit)
  # Selection rule:
  #  1. Primary metric = pooled out-of-sample MSE skill, 1 - MSE/MSE_null (null = training mean),
  #     weighted by test-season effective n.
  #  2. M3 (hybrid) is selected only if it beats M2 (all-balls) on skill in >= 2 of 3 folds AND
  #     on pooled skill; otherwise the best of M1/M2 by pooled skill. (Pressure-specific terms
  #     are not forced in.)
  #  3. The pre-registered T10 composite (M4: pressure value + WPA + consistency) is evaluated
  #     by pooled Spearman only; it replaces the selected estimator only if its pooled Spearman
  #     is higher.
  # Decision D6 (participant, 17 Nov 2026) — disclosed deviation from the rule above, made after
  # seeing T11 validation: bowling uses M2. Reasons: (1) M3's skill edge over M2 (0.009) is within
  # noise; (2) with residual variance tau2_R = 0, M3 collapses to non-pressure ability and ignores
  # pressure balls; (3) M2 has the higher out-of-sample correlation (0.213 vs 0.198) and matches
  # the batting estimator. The rule's own choice is still reported.
  override:
    bowl: M2
